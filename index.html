<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Ofis</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#150b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ofis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: tek sütun, telefon önce; yumuşak "blob" yüzeyler, neon vurgular, hap biçimli düğmeler */
:root{
  --bg:#fff5fb; --yuzey:#ffffff; --yuzey2:#fdebf6; --ink:#24142f; --soluk:#7a6585; --cizgi:#f3d7ea;
  --pembe:#e8187f; --lime:#5f9e00; --turkuaz:#0a8fb8; --mor:#7b45e6;
  --ok:#15803d; --uyari:#c2410c; --bekle:#6b7280; --hata:#be123c;
  --display:"Quicksand", "Trebuchet MS", system-ui, sans-serif;
  --govde:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:24px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#150b22; --yuzey:#20132f; --yuzey2:#2a1a3d; --ink:#f6eefc; --soluk:#b9a6c9; --cizgi:#3a2852;
  --pembe:#ff4fa7; --lime:#b6ff3b; --turkuaz:#3fd3ff; --mor:#a98bff; --ok:#4ade80; --uyari:#fb923c; --bekle:#a1a1aa; --hata:#fb7185; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--govde);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sayfa{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.ust{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ust .sag{display:flex;align-items:center;gap:8px}
.taze{font-size:12px;color:var(--soluk);font-variant-numeric:tabular-nums}
.taze.eski{color:var(--uyari)}
.blob{position:relative;background:var(--yuzey);border-radius:var(--r);padding:18px;border:1px solid var(--cizgi);overflow:hidden}
.gm{background:linear-gradient(135deg, color-mix(in srgb, var(--mor) 14%, var(--yuzey)), color-mix(in srgb, var(--pembe) 12%, var(--yuzey)));border:0}
.gm::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:120px;border-radius:58% 42% 61% 39% / 47% 55% 45% 53%;background:color-mix(in srgb, var(--lime) 30%, transparent)}
.gm .etiket{font-family:var(--display);font-weight:700;font-size:13px;color:var(--mor);text-transform:uppercase;letter-spacing:.06em;position:relative;z-index:1}
.gm #gmOzet{margin:6px 0 0;position:relative;z-index:1;line-height:1.5}
.gm #gmOzet.kisa{max-height:7.5em;overflow:hidden}
.gm .devam{position:relative;z-index:1;margin-top:8px;background:none;border:0;padding:0;color:var(--mor);font:700 13px var(--display);cursor:pointer}
.is-ver{display:flex;flex-direction:column;gap:10px}
textarea,input[type=password]{width:100%;font:inherit;color:inherit;background:var(--yuzey2);border:1px solid var(--cizgi);border-radius:18px;padding:12px 14px}
textarea{resize:vertical;min-height:72px}
textarea:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--pembe);outline-offset:2px}
.hap{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.hap.ana{background:var(--pembe);color:#fff}
.hap.ana[aria-disabled="true"]{opacity:.45;pointer-events:none}
.hap.ikincil{background:var(--yuzey2);color:var(--ink);border:1px solid var(--cizgi)}
.hap.kucuk{padding:6px 12px;font-size:13px}
.hap.yenile{min-height:44px;min-width:110px;padding:10px 18px;font-size:15px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hap.yenile:active{transform:scale(.96)}
.hap.yenile[disabled]{opacity:.7}
.not{font-size:12px;color:var(--soluk);margin:0}
.liste{display:flex;flex-direction:column;gap:10px}
.firsat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:20px;padding:12px 14px}
.firsat .rozet{grid-row:span 2;font-family:var(--display);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb, var(--lime) 22%, transparent);white-space:nowrap;font-variant-numeric:tabular-nums}
.firsat .kim{font-size:12px;color:var(--soluk)}
.firsat .metin{min-width:0;overflow-wrap:anywhere}
.firsat a{color:var(--turkuaz);font-weight:600}
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);overflow:hidden}
.kart summary{list-style:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;cursor:pointer}
.kart summary::-webkit-details-marker{display:none}
.avatar{width:44px;height:44px;border-radius:46% 54% 52% 48% / 55% 45% 55% 45%;display:grid;place-items:center;font-size:22px}
.kart .ad{font-family:var(--display);font-weight:700;font-size:16px}
.kart .unvan{font-size:13px;color:var(--soluk)}
.durum{font-family:var(--display);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.d-tamam{background:color-mix(in srgb, var(--ok) 16%, transparent);color:var(--ok)}
.d-calisiyor{background:color-mix(in srgb, var(--uyari) 16%, transparent);color:var(--uyari)}
.d-hazir{background:color-mix(in srgb, var(--turkuaz) 16%, transparent);color:var(--turkuaz)}
.d-beklemede{background:color-mix(in srgb, var(--bekle) 16%, transparent);color:var(--bekle)}
.kart .icerik{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--cizgi)}
.kart .icerik h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--pembe)}
.kart .icerik p{margin:0}
.dugmeler{display:flex;flex-wrap:wrap;gap:8px}
.isler .satir{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:18px;padding:10px 14px;text-decoration:none;color:inherit}
.isler .no{font-family:var(--display);font-weight:700;color:var(--soluk);font-variant-numeric:tabular-nums}
.isler .baslik{min-width:0;overflow-wrap:anywhere}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{font-family:var(--display);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--yuzey2);border:1px solid var(--cizgi);color:inherit}
.cip.on{background:var(--pembe);border-color:var(--pembe);color:#fff}
.fk{background:var(--yuzey);border:1px solid var(--cizgi);border-left:5px solid var(--renk,var(--pembe));border-radius:20px;padding:12px 14px;overflow-wrap:anywhere}
.fk .fust{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--soluk);margin-bottom:4px}
.fk .fust b{color:var(--renk,var(--pembe))}
.fk .fust .drm{margin-left:auto;font-weight:700}
.fk h4{margin:0 0 4px;font-family:var(--display);font-size:15px;line-height:1.35}
.fk p{margin:0 0 4px;font-size:14px}
.fk a{color:var(--turkuaz);font-weight:600}
.bos{background:var(--yuzey2);border-radius:var(--r);padding:18px;color:var(--soluk)}
/* kilit ekranı */
.kilit{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.kilit form{width:100%;max-width:380px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.kilit form::before{content:"";position:absolute;left:-50px;bottom:-60px;width:170px;height:150px;border-radius:61% 39% 52% 48% / 44% 58% 42% 56%;background:color-mix(in srgb, var(--pembe) 22%, transparent)}
.kilit form > *{position:relative}
.kilit label.kutu{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soluk)}
.kilit .hata{color:var(--hata);font-size:14px;min-height:20px}
/* rapor okuyucu */
.okuyucu{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.okuyucu header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--cizgi);background:var(--yuzey)}
.okuyucu header b{font-family:var(--display);font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.okuyucu article{overflow:auto;-webkit-overflow-scrolling:touch;padding:18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));max-width:680px;width:100%;margin:0 auto;overflow-wrap:anywhere}
.okuyucu article h1{font-size:22px}.okuyucu article h2{font-size:18px;margin-top:24px;color:var(--pembe)}.okuyucu article h3{font-size:16px;margin-top:16px}
.okuyucu article a{color:var(--turkuaz)}
.okuyucu article table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;max-width:100%}
.okuyucu article th,.okuyucu article td{border:1px solid var(--cizgi);padding:6px 8px;text-align:left;vertical-align:top}
.okuyucu article th{background:var(--yuzey2)}
.okuyucu article figure{margin:14px 0}
.pdf-alan{margin:28px 0 8px;padding-top:14px;border-top:1px solid var(--cizgi);display:flex;flex-direction:column;gap:6px}
@media print{@page{size:A4;margin:12mm 0}
  html, body.pdf-yazdir, body.pdf-yazdir *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body.pdf-yazdir > *:not(.okuyucu){display:none !important}
  body.pdf-yazdir, body.pdf-yazdir .okuyucu{--bg:#fff;--yuzey:#fff;--yuzey2:#fdebf6;--ink:#24142f;--soluk:#7a6585;--cizgi:#f3d7ea;--pembe:#e8187f;--lime:#5f9e00;--turkuaz:#0a8fb8;--mor:#7b45e6;color:#24142f}
  body.pdf-yazdir{background:var(--bg) !important;padding:0 !important}
  body.pdf-yazdir .okuyucu{position:static !important;background:var(--bg) !important;display:block !important}
  body.pdf-yazdir .okuyucu header{background:linear-gradient(135deg,var(--pembe),var(--mor)) !important;color:#fff !important;border:0 !important;padding:7mm 16mm 6mm !important}
  body.pdf-yazdir .okuyucu header b{color:#fff !important;font-size:20px}
  body.pdf-yazdir .okuyucu header button, body.pdf-yazdir .pdf-alan{display:none !important}
  body.pdf-yazdir .okuyucu article{overflow:visible !important;max-width:none !important;padding:8mm 16mm 0 !important;font-size:11pt}
  body.pdf-yazdir .okuyucu article img{max-width:100% !important;border-radius:14px;break-inside:avoid}
  body.pdf-yazdir .okuyucu article table{display:table !important;font-size:9pt}
  body.pdf-yazdir .okuyucu article tr{break-inside:avoid}}.okuyucu article code{background:var(--yuzey2);padding:1px 5px;border-radius:6px}
@media (prefers-reduced-motion: no-preference){.kart[open] .icerik{animation:ac .18s ease-out}@keyframes ac{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="kilit" id="kilit">
  <form id="kilitForm" autocomplete="on">
    <h1>Claude Ofis</h1>
    <p class="not">Ofis verisi şifreli. Açmak için ofis şifrenizi yazın.</p>
    <input id="sifre" type="password" autocomplete="current-password" placeholder="Şifre" required>
    <label class="kutu"><input type="checkbox" id="hatirla" checked> Bu cihazda hatırla</label>
    <button class="hap ana" id="ac">Aç</button>
    <div class="hata" id="kilitHata" role="alert"></div>
  </form>
</div>

<main class="sayfa" id="uygulama" hidden>
  <div class="ust">
    <h1>Claude Ofis</h1>
    <div class="sag"><span class="taze" id="taze"></span><button type="button" class="hap ikincil yenile" id="yenile">↻ Yenile</button></div>
  </div>

  <section class="blob gm" aria-label="Genel Müdür özeti">
    <div class="etiket">👔 Genel Müdür</div>
    <div id="gmOzet" class="kisa"></div>
    <button class="devam" id="gmDevam" hidden>Devamı</button>
  </section>

  <section class="blob is-ver" aria-label="Yeni iş ver">
    <h2>📨 Genel Müdüre iş ver</h2>
    <label for="isMetni" class="not">Ne istediğinizi yazın; özel GitHub deponuzda not olarak açılır, bilgisayar 1–2 dakikada işe başlar.</label>
    <textarea id="isMetni" placeholder="Örn: Mira 60 m² kafe için 3 konsept önersin"></textarea>
    <div class="dugmeler">
      <a class="hap ana" id="isGonder" href="#" target="_blank" rel="noopener" aria-disabled="true">GitHub'da gönder</a>
      <a class="hap ikincil" id="depoLink" href="#" target="_blank" rel="noopener">Özel depo</a>
    </div>
  </section>

  <section class="liste" aria-labelledby="fBaslik"><h2 id="fBaslik">🔔 Fırsatlar</h2><div class="liste" id="firsatlar"></div></section>
  <section class="liste" aria-labelledby="hBaslik"><h2 id="hBaslik">💡 Bu ayın fırsatları</h2><div class="liste" id="havuz"></div></section>
  <section class="liste" aria-labelledby="eBaslik"><h2 id="eBaslik">👥 Ekip</h2><div class="liste" id="ekip"></div></section>
  <section class="liste isler" aria-labelledby="iBaslik"><h2 id="iBaslik">📋 Telefondan verilen işler</h2><div class="liste" id="isler"></div></section>
  <button class="hap ikincil kucuk" id="kilitle" style="align-self:center">Bu cihazda kilitle</button>
</main>

<div class="okuyucu" id="okuyucu" hidden role="dialog" aria-modal="true" aria-labelledby="okBaslik">
  <header><b id="okBaslik">Rapor</b><button class="hap ikincil" id="okKapat">Kapat</button></header>
  <article id="okIcerik"></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const durumAd = {hazir:"Hazır", calisiyor:"Çalışıyor", tamam:"Rapor teslim", beklemede:"Beklemede"};
  const isDurumAd = {calisiyor:"⏳ Çalışıyor", bitti:"✅ Bitti", hata:"⚠️ Hata", sirada:"🕒 Sırada"};
  const DEPOLAMA = "ofis-cep-anahtar";
  let veri = null, depo = "", anahtar = null;

  /* ---------- şifre çözme (PBKDF2-SHA256 -> AES-256-CBC + HMAC-SHA256) ---------- */
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64Yaz = b => btoa(String.fromCharCode(...b));
  async function turet(sifre, tuz, tekrar){
    const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:tuz, iterations:tekrar}, k, 512));
  }
  async function coz(paket, bitler){
    const tuz = b64(paket.salt), iv = b64(paket.iv), ct = b64(paket.ct);
    const imzali = new Uint8Array(tuz.length + iv.length + ct.length);
    imzali.set(tuz); imzali.set(iv, tuz.length); imzali.set(ct, tuz.length + iv.length);
    const hk = await crypto.subtle.importKey("raw", bitler.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
    if (!await crypto.subtle.verify("HMAC", hk, b64(paket.mac), imzali)) throw new Error("sifre");
    const ak = await crypto.subtle.importKey("raw", bitler.slice(0, 32), {name:"AES-CBC"}, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC", iv}, ak, ct)));
  }
  async function paketGetir(){
    const r = await fetch("veri.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("ag");
    return r.json();
  }
  function kayitliAnahtar(){ try { return JSON.parse(localStorage.getItem(DEPOLAMA) || "null"); } catch (e) { return null; } }

  async function yukle(sessiz){
    try {
      const paket = await paketGetir();
      const k = anahtar || kayitliAnahtar();
      if (!k || k.salt !== paket.salt) { kilitGoster(sessiz ? "" : ""); return; }
      anahtar = k;
      ciz(await coz(paket, b64(k.bitler)));
      $("#kilit").hidden = true; $("#uygulama").hidden = false;
    } catch (e) {
      if (e.message === "ag") { $("#taze").textContent = "Bağlantı yok; son açılan veri gösteriliyor."; if (!veri) kilitGoster("İnternet bağlantısı gerekli."); }
      else { try { localStorage.removeItem(DEPOLAMA); } catch (x) {} anahtar = null; kilitGoster("Şifre değişmiş olabilir; yeniden girin."); }
    }
  }
  function kilitGoster(mesaj){ $("#uygulama").hidden = true; $("#kilit").hidden = false; $("#kilitHata").textContent = mesaj || ""; }

  $("#kilitForm").addEventListener("submit", async e => {
    e.preventDefault();
    const b = $("#ac"); b.disabled = true; $("#kilitHata").textContent = "Açılıyor…";
    try {
      const paket = await paketGetir();
      const bitler = await turet($("#sifre").value, b64(paket.salt), paket.iter);
      const d = await coz(paket, bitler);
      anahtar = {salt: paket.salt, bitler: b64Yaz(bitler)};
      if ($("#hatirla").checked) { try { localStorage.setItem(DEPOLAMA, JSON.stringify(anahtar)); } catch (x) {} }
      $("#sifre").value = ""; $("#kilitHata").textContent = "";
      ciz(d); $("#kilit").hidden = true; $("#uygulama").hidden = false;
    } catch (err) {
      $("#kilitHata").textContent = err.message === "ag" ? "Veri indirilemedi; bağlantıyı kontrol edin." : "Şifre yanlış.";
    }
    b.disabled = false;
  });
  $("#kilitle").addEventListener("click", () => { try { localStorage.removeItem(DEPOLAMA); } catch (e) {} anahtar = null; veri = null; kilitGoster(""); });
  // Yenile: basınca görünür geri bildirim (yeni bir şey yoksa da "Güncel" der)
  $("#yenile").addEventListener("click", async () => {
    const b = $("#yenile"); if (b.disabled) return;
    b.disabled = true; b.textContent = "Yenileniyor…";
    const once = JSON.stringify(veri || null);
    await yukle(true);
    b.textContent = JSON.stringify(veri || null) !== once ? "✓ Yenilendi" : "✓ Güncel";
    setTimeout(() => { b.textContent = "↻ Yenile"; b.disabled = false; }, 1800);
  });
  $("#gmDevam").addEventListener("click", () => { const oz = $("#gmOzet"), acik = oz.classList.toggle("kisa"); $("#gmDevam").textContent = acik ? "Devamı" : "Daha az"; });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && anahtar) yukle(true); });

  /* ---------- görünüm ---------- */
  function isLinki(baslik){ return depo ? depo + "/issues/new?title=" + encodeURIComponent(baslik) : "#"; }
  function tarihYaz(iso){ if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleString("tr-TR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); }
  function mdHtml(md, dizin){
    if (window.marked && window.DOMPurify) { const k = document.createElement("div"); k.innerHTML = DOMPurify.sanitize(marked.parse(md || "")); k.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
      // ARYA konsept görselleri: şifreli küçük kopyası varsa sonra indirilip çözülür (gorselleriYukle), yoksa not
      k.querySelectorAll("img").forEach(img => { const s = img.getAttribute("src") || ""; if (/^(https?:|data:)/i.test(s)) return;
        const rel = dizin ? (dizin + "/" + s.replace(/^\.\//, "")) : "", ad = ((veri && veri.durum && veri.durum.aryaGorseller) || {})[rel];
        if (ad) { const fg = document.createElement("figure"); fg.className = "sifreli-gorsel"; fg.dataset.dosya = ad; fg.dataset.alt = img.getAttribute("alt") || s; fg.textContent = "🖼 Görsel yükleniyor…"; img.replaceWith(fg); return; }
        const e = document.createElement("p"); e.className = "not"; e.textContent = `🖼 ${img.getAttribute("alt") || s}: bu görsel telefona henüz gönderilmedi (bilgisayardaki panelde görünür).`; img.replaceWith(e); });
      return k.innerHTML; }
    return "<pre style='white-space:pre-wrap'>" + esc(md) + "</pre>";
  }
  const metin = $("#isMetni"), gonder = $("#isGonder");
  function gonderGuncelle(){
    const m = metin.value.trim(), s = m.split("\n");
    gonder.href = m && depo ? depo + "/issues/new?title=" + encodeURIComponent(s[0].slice(0, 200)) + (s.length > 1 ? "&body=" + encodeURIComponent(s.slice(1).join("\n")) : "") : "#";
    gonder.setAttribute("aria-disabled", m && depo ? "false" : "true");
  }
  metin.addEventListener("input", gonderGuncelle);
  gonder.addEventListener("click", () => setTimeout(() => { metin.value = ""; gonderGuncelle(); }, 400));

  function ciz(p){
    veri = p; const v = p.durum || {}; depo = v.depo || "";
    $("#depoLink").href = depo || "#"; gonderGuncelle();
    $("#taze").textContent = "Ofiste son hareket: " + tarihYaz(v.esitleme);
    $("#taze").title = "Yeni iş, rapor ya da fırsat olduğunda bilgisayardaki köprü veriyi bir dakika içinde yeniler.";
    // "--- Önceki" ile başlayan eski notlar ayrı paragraf olarak görünsün; ilk 5 satır gösterilir
    const oz = $("#gmOzet");
    const parcalar = String((v.gm && v.gm.sonOzet) || "Henüz özet yok.").split(/\s*---\s*/).filter(Boolean).map((p, i) => {
      p = p.trim().replace(/^Önceki\s*/i, "").replace(/^:\s*/, "");
      const m = p.match(/^(\d{4}-\d{2}-\d{2})?\s*\(([^)]{1,60})\)\s*:\s*/);
      const govde = esc(m ? p.slice(m[0].length) : p).replace(/https?:\/\/localhost[^\s<]*/g, "(bilgisayarda)").replace(/⚠️/g, "<br>⚠️");
      return `<div style="margin:0 0 10px${i ? ";opacity:.75" : ""}">${m ? `<b>${esc(m[2])}</b><br>` : ""}${govde}</div>`;
    });
    oz.innerHTML = parcalar[0] + (parcalar.length > 1 ? `<div style="margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.6">Önceki işler</div>` + parcalar.slice(1).join("") : "");
    oz.classList.add("kisa");
    requestAnimationFrame(() => { $("#gmDevam").hidden = oz.scrollHeight <= oz.clientHeight + 2; $("#gmDevam").textContent = "Devamı"; });
    const f = v.firsatlar || [];
    $("#firsatlar").innerHTML = f.length ? f.map(x => `<div class="firsat"><span class="rozet">${esc(tarihYaz(x.tarih) || x.tarih)}</span><span class="kim">${esc(x.kimden)}</span><span class="metin">${esc(x.metin)}${x.link ? ` <a href="${esc(x.link)}" target="_blank" rel="noopener">aç</a>` : ""}</span></div>`).join("") : `<div class="bos">Şu an fırsat yok.</div>`;
    havuzCiz(v);
    const c = v.calisanlar || [];
    $("#ekip").innerHTML = c.length ? c.map(k => `
      <details class="kart"><summary>
        <span class="avatar" style="background:color-mix(in srgb, ${esc(k.renk || "#e8187f")} 22%, transparent)">${esc(k.ikon || "🙂")}</span>
        <span style="min-width:0"><span class="ad">${esc(k.kod)} · ${esc(k.isim)}</span>${k.departman ? ` <span class="unvan">· ${esc(k.departman)}</span>` : ""}<br><span class="unvan">${esc(k.unvan)}</span></span>
        <span class="durum d-${esc(k.durum)}">${esc(durumAd[k.durum] || k.durum)}</span></summary>
        <div class="icerik">
          <div><h3>Şu an</h3><p>${esc(k.suankiIs)}</p></div>
          ${k.sonRapor ? `<div><h3>Son rapor · ${esc(k.sonRapor.tarih)}</h3><p>${esc(k.sonRapor.ozet)}</p></div>` : `<p class="not">Henüz rapor yok.</p>`}
          <div class="dugmeler">${k.sonRapor ? `<button class="hap ana" data-oku="${esc(k.kod)}">📄 Raporu oku</button>` : ""}${(k.komutlar || []).map(m => `<a class="hap ikincil" href="${esc(isLinki(m.metin))}" target="_blank" rel="noopener">${esc(m.etiket)}</a>`).join("")}</div>
          <p class="not">${esc(k.gorev)} · ${esc(k.siklik)}</p>
        </div></details>`).join("") : `<div class="bos">Ekip bilgisi yok.</div>`;
    document.querySelectorAll("[data-oku]").forEach(b => b.addEventListener("click", () => raporAc(b.dataset.oku)));
    const i = v.isler || [];
    $("#isler").innerHTML = i.length ? i.map(x => `<a class="satir" href="${esc(depo + "/issues/" + x.no)}" target="_blank" rel="noopener"><span class="no">#${esc(x.no)}</span><span class="baslik">${esc(x.baslik)}</span><span class="durum d-${x.durum === "bitti" ? "tamam" : x.durum === "calisiyor" ? "calisiyor" : "beklemede"}">${esc(isDurumAd[x.durum] || x.durum)}</span></a>`).join("") : `<div class="bos">Henüz telefondan iş verilmedi.</div>`;
  }
  /* 💡 Aylık fırsat havuzu: GENELMÜDÜR/firsatlar/YYYY-AA.md tablosu */
  const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  function havuzOku(md){
    const satirlar = [];
    String(md || "").split(/\r?\n/).forEach(l => { if (!/^\|\s*\d{4}-\d{2}-\d{2}/.test(l)) return;
      const h = l.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      satirlar.push({tarih:h[0]||"", kim:h[1]||"", tur:h[2]||"", firsat:h[3]||"", neden:h[4]||"", kaynak:h[5]||"", durum:h[6]||"Yeni"}); });
    const i = String(md || "").indexOf("## Genel Müdür analizi");
    return {satirlar, analiz: i >= 0 ? String(md).slice(i + 22).trim() : ""};
  }
  const satirIci = s => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parseInline(s || "")).replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" ') : esc(s);
  let havuzVeri = null, havuzSuz = null;
  function kimRenk(kim){ const k = (((veri || {}).durum || {}).calisanlar || []).find(x => (kim || "").startsWith(x.kod)); return (k && k.renk) || "var(--pembe)"; }
  const fkHtml = s => `<div class="fk" style="--renk:${esc(kimRenk(s.kim))}"><div class="fust"><span class="cip">${esc(s.tur)}</span><b>${esc(s.kim)}</b><span>${esc(s.tarih)}</span><span class="drm">${esc(s.durum)}</span></div>
      <h4>${satirIci(s.firsat)}</h4><p>${satirIci(s.neden)}</p>${s.kaynak ? `<p class="not">🔗 ${satirIci(s.kaynak)}</p>` : ""}</div>`;
  function havuzCiz(v){
    const el = $("#havuz");
    if (!v.havuz) { el.innerHTML = `<div class="bos">Bu ay henüz fırsat önerisi yok.</div>`; havuzVeri = null; return; }
    havuzVeri = havuzOku(v.havuz.icerik); havuzVeri.ay = v.havuz.ay;
    const m = String(v.havuz.ay).match(/(\d{4})-(\d{2})/); havuzVeri.ad = m ? `${AYLAR[+m[2]-1]} ${m[1]}` : v.havuz.ay;
    $("#hBaslik").textContent = `💡 ${havuzVeri.ad} fırsatları`;
    const s = havuzVeri.satirlar, kisi = new Map(); s.forEach(x => kisi.set(x.kim, (kisi.get(x.kim) || 0) + 1));
    el.innerHTML = !s.length ? `<div class="bos">Bu ay henüz fırsat önerisi yok.</div>` :
      `<div class="cipler">${[...kisi].sort((a,b) => b[1]-a[1]).map(([k,n]) => `<span class="cip">${esc(k)} · ${n}</span>`).join("")}</div>`
      + s.slice(-3).reverse().map(fkHtml).join("")
      + `<div class="dugmeler"><button class="hap ana" id="havuzAc">💡 Tümü (${s.length}) ve analiz</button><a class="hap ikincil" href="${esc(isLinki("Aylık fırsatları analiz et: GENELMÜDÜR/firsatlar/" + havuzVeri.ay + ".md"))}" target="_blank" rel="noopener">🔍 Analiz iste</a></div>`;
    const b = $("#havuzAc"); if (b) b.addEventListener("click", () => { havuzSuz = null; havuzAc(); });
  }
  function havuzAc(){
    const h = havuzVeri; if (!h) return;
    const kisi = [...new Set(h.satirlar.map(x => x.kim))];
    const gorunen = h.satirlar.filter(x => !havuzSuz || x.kim === havuzSuz || x.tur === havuzSuz).slice().reverse();
    $("#okBaslik").textContent = `💡 ${h.ad} · ${h.satirlar.length} fırsat`;
    $("#okIcerik").innerHTML = `<div class="cipler" style="margin-bottom:12px">${kisi.concat([...new Set(h.satirlar.map(x => x.tur))]).map(k => `<button class="cip ${havuzSuz === k ? "on" : ""}" data-suz="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <div class="liste">${gorunen.map(fkHtml).join("") || `<div class="bos">Bu filtrede fırsat yok.</div>`}</div>
      <h2>👔 Genel Müdür analizi</h2>${h.analiz ? mdHtml(h.analiz) : "<p>Henüz analiz yok.</p>"}${pdfAlani()}`;
    pdfBagla(`firsatlar-${h.ay}`);
    document.querySelectorAll("[data-suz]").forEach(b => b.addEventListener("click", () => { havuzSuz = havuzSuz === b.dataset.suz ? null : b.dataset.suz; havuzAc(); }));
    ok.hidden = false;
  }
  // şifreli görseli indir → telefon anahtarıyla çöz → göster
  async function gorselleriYukle(kap){
    for (const fg of kap.querySelectorAll("figure.sifreli-gorsel")) {
      try {
        const r = await fetch(fg.dataset.dosya, {cache:"force-cache"}); if (!r.ok) throw new Error("yok");
        const g = await coz(await r.json(), b64(anahtar.bitler));
        const img = document.createElement("img"); img.alt = fg.dataset.alt; img.src = "data:" + g.t + ";base64," + g.b;
        img.style.cssText = "width:100%;border-radius:16px;display:block;background:var(--yuzey2)";
        fg.textContent = ""; fg.appendChild(img);
      } catch (e) { fg.textContent = "🖼 Görsel henüz telefona ulaşmadı; birkaç dakika sonra Yenile."; fg.className = "not"; }
    }
  }
  // PDF (telefon): ana ekrana eklenmiş uygulamada iPhone yazdırma penceresi açmaz. Bu yüzden PDF doğrudan dosya olarak üretilir
  // (html2pdf, renkli), sonra paylaş menüsünden "Dosyalar'a Kaydet" ile saklanır.
  const pdfAlani = () => `<div class="pdf-alan"><button type="button" class="hap ana" id="pdfDugme">📄 PDF olarak indir</button><p class="not">Önce PDF hazırlanır; sonra düğmeye tekrar basıp paylaş menüsünden "Dosyalar'a Kaydet"i seç.</p></div>`;
  let h2pYuk = null;
  const h2pYukle = () => h2pYuk || (h2pYuk = new Promise((ok, hata) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; s.onload = ok; s.onerror = () => { h2pYuk = null; hata(new Error("PDF kütüphanesi indirilemedi")); }; document.head.appendChild(s); }));
  function pdfKabugu(){
    // açık raporun kopyası, açık renk kâğıt ve uygulamanın renkleriyle (ekranın arkasında, görünmeden)
    const dis = document.createElement("div");   // görünmeyen dış kap; PDF kütüphanesine içteki düz akışlı öğe verilir
    dis.style.cssText = "position:absolute;left:0;top:0;width:760px;z-index:-1;overflow:hidden;height:1px";
    const kap = document.createElement("div"); kap.className = "okuyucu"; dis.appendChild(kap);
    kap.style.cssText = "position:static;inset:auto;z-index:auto;display:block;width:760px;padding:0;background:#fff;color:#24142f;--bg:#fff;--yuzey:#fff;--yuzey2:#fdebf6;--ink:#24142f;--soluk:#7a6585;--cizgi:#f3d7ea;--pembe:#e8187f;--lime:#5f9e00;--turkuaz:#0a8fb8;--mor:#7b45e6";
    const bas = document.createElement("div");
    bas.style.cssText = "background:linear-gradient(135deg,#e8187f,#7b45e6);color:#fff;padding:20px 26px;font:700 21px Quicksand,system-ui,sans-serif";
    bas.textContent = $("#okBaslik").textContent;
    const ic = $("#okIcerik").cloneNode(true); ic.removeAttribute("id");
    ic.style.cssText = "overflow:visible;max-width:none;width:auto;padding:18px 26px 10px;margin:0;color:#24142f";
    ic.querySelectorAll(".pdf-alan").forEach(e => e.remove());
    ic.querySelectorAll("table").forEach(t => { t.style.display = "table"; t.style.width = "100%"; });
    ic.querySelectorAll("button.cip").forEach(e => e.style.pointerEvents = "none");
    kap.append(bas, ic); document.body.appendChild(dis); return kap;
  }
  async function paylasVeyaKaydet(dosya){
    if (navigator.canShare && navigator.canShare({files: [dosya]})) {
      try { await navigator.share({files: [dosya], title: dosya.name}); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(dosya), a = document.createElement("a");
    a.href = url; a.download = dosya.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function pdfBagla(ad){
    const b = $("#pdfDugme"); if (!b) return;
    const dosyaAdi = String(ad || "rapor").replace(/[\\/:*?"<>|\s]+/g, "-").replace(/-+$/, "") + ".pdf";
    let hazir = null;
    b.addEventListener("click", async () => {
      if (hazir) { await paylasVeyaKaydet(hazir); return; }
      b.disabled = true; b.textContent = "PDF hazırlanıyor…";
      let kap = null;
      try {
        await h2pYukle();
        kap = pdfKabugu();
        const yuk = Math.max(1, kap.scrollHeight), olcek = Math.max(0.8, Math.min(2, Math.sqrt(15e6 / (760 * yuk))));   // iPhone tuval sınırı
        const blob = await html2pdf().set({
          margin: [8, 0, 10, 0], filename: dosyaAdi,
          image: {type: "jpeg", quality: 0.92},
          html2canvas: {scale: olcek, useCORS: true, backgroundColor: "#ffffff", windowWidth: 760},
          jsPDF: {unit: "mm", format: "a4", orientation: "portrait"},
          pagebreak: {mode: ["css", "legacy"], avoid: ["img", "tr", ".fk", "figure", "h2", "h3"]}
        }).from(kap).outputPdf("blob");
        hazir = new File([blob], dosyaAdi, {type: "application/pdf"});
        b.textContent = "📤 PDF hazır · kaydet / paylaş";
      } catch (e) {
        b.textContent = "📄 PDF olarak indir"; alert("PDF oluşturulamadı: " + (e.message || e));
      } finally { if (kap && kap.parentNode) kap.parentNode.remove(); b.disabled = false; }
    });
  }  const ok = $("#okuyucu");
  function raporAc(kod){
    const k = ((veri.durum || {}).calisanlar || []).find(x => x.kod === kod) || {};
    const r = (veri.raporlar || {})[kod];
    $("#okBaslik").textContent = `${k.isim || ""} · ${k.sonRapor ? k.sonRapor.tarih : ""}`;
    const dz = r && r.dosya ? String(r.dosya).split("/").slice(0, -1).join("/") : "";
    $("#okIcerik").innerHTML = r && r.icerik ? mdHtml(r.icerik, dz) + pdfAlani() : "<p>Rapor metni bulunamadı.</p>";
    pdfBagla(`${k.kod || kod}-${k.isim || ""}-${k.sonRapor ? k.sonRapor.tarih : ""}`);
    gorselleriYukle($("#okIcerik"));
    ok.hidden = false; $("#okIcerik").scrollTop = 0; $("#okKapat").focus();
  }
  $("#okKapat").addEventListener("click", () => { ok.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") ok.hidden = true; });

  yukle(false);
})();
</script>
</body>
</html>
